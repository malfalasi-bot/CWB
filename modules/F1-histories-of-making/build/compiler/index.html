<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edo Concept Composer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top" id="top">
  <div class="top-row">
    <span class="brand"><span class="brand-mark" aria-hidden="true">合</span><span class="brand-name">Edo Concept Composer</span></span>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-versions" aria-controls="view-versions" aria-selected="false" data-view="versions">Versions</button>
      <button role="tab" id="tab-compose" aria-controls="view-compose" aria-selected="true" data-view="compose">Compose</button>
    </nav>
    <button type="button" class="verdict-pill" id="verdictPill" aria-label="Open the summary"></button>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch colour theme" title="Theme">◐</button>
  </div>
</header>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<main id="main">
  <section id="view-versions" class="view" role="tabpanel" aria-labelledby="tab-versions" hidden></section>
  <section id="view-compose" class="view" role="tabpanel" aria-labelledby="tab-compose"></section>
</main>
<dialog id="lightbox" class="lightbox" aria-label="Enlarged image">
  <div class="lb-bar">
    <p class="lb-title" id="lbTitle"></p>
    <div class="lb-tools" id="lbTools"></div>
    <form method="dialog"><button class="btn" value="close" aria-label="Close">Close ✕</button></form>
  </div>
  <div class="lb-stage" id="lbStage"></div>
  <button type="button" class="lb-nav prev" id="lbPrev" aria-label="Previous">‹</button>
  <button type="button" class="lb-nav next" id="lbNext" aria-label="Next">›</button>
</dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
