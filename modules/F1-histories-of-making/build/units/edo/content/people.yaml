  vangogh:
    name: Vincent van Gogh
    kanji: ""
    group: afterlife
    born: 1853
    died: 1890
    img: portrait-van-gogh
    cap: "Self-Portrait, 1887 · Art Institute of Chicago via Wikimedia Commons · public domain"
    line: "Bought about 660 prints in early 1887. Painted three copies that autumn."
    role: Painter
    bet: "That cheap Japanese prints could teach a European painter to see colour."
    highlights:
      - {t: "Bought about 660 Japanese prints, early 1887", conf: documented}
      - {t: "Painted three copies in oil that autumn", conf: documented}
      - {t: "Two after Hiroshige, one after Eisen", conf: documented}
    story: |
      Vincent van Gogh met Japanese prints as a buyer. In early 1887, in Paris, he bought about 660 of them: cheap sheets from the second trade, probably from Bing’s stock (probable).
      He hung some in a Paris café and studied the rest closely.
      That autumn he painted three copies in oil. Two were after Hiroshige’s *Hundred Famous Views of Edo*: the plum orchard at Kameido and the sudden shower over Shin-Ōhashi. The third copied a courtesan by Keisai Eisen.
      His copies change what they copy. The colours are heightened, and he painted borders of Japanese characters around them (probable).
      Both Hiroshige sheets were published by Uoya Eikichi, and both carry their censor’s seals.
      The copies and many of the prints are in the Van Gogh Museum in Amsterdam. The museum’s licence is non-commercial, so this unit links to them and does not show them.
    works: [plum, shower, eisen-aizuri]
    worksNote: "The sheets he copied, by Hiroshige and Eisen; his own copies are linked, not shown."
    links:
      - {to: hiroshige, rel: "copied two sheets by"}
      - {to: eisen, rel: "copied a courtesan by"}
      - {to: bing, rel: "bought prints from (probable)"}
    life:
      - {y: 1887.2, t: "Buys about 660 prints"}
      - {y: 1887.8, t: "Three copies in oil"}
