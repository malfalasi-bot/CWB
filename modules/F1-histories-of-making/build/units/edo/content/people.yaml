  kyoden:
    name: Santō Kyōden
    kanji: 山東京伝
    group: witnesses
    born: 1761
    died: 1816
    img: portrait-kyoden
    cap: "Eiri, portrait of Santō Kyōden, c. 1795 · The Met, CC0"
    line: "Writer as Kyōden, designer as Kitao Masanobu. Fifty days in manacles in 1791."
    role: Writer and designer
    bet: "That a comic book could sell like a print, ten thousand copies at a time."
    highlights:
      - {t: "Designed as Kitao Masanobu, wrote as Kyōden", conf: documented}
      - {t: "Handcuffed fifty days for three books, 1791", conf: documented}
      - {t: "Ran a tobacco shop in Ginza from 1793", conf: documented}
    story: |
      Santō Kyōden was born in Fukagawa, Edo, on 13 September 1761. He trained as a designer under Kitao Shigemasa and illustrated comic books as Kitao Masanobu.
      He then wrote his own: *kibyōshi*, satirical picture books, and *sharebon*, stories of the pleasure quarter. In the 1790s one of his books could sell ten thousand copies.
      In 1791 three of his *sharebon*, published by Tsutaya, were judged offensive under the Kansei reforms. He was handcuffed for fifty days.
      He changed course. From the autumn of 1793 he ran a successful tobacco shop in Ginza, and advertised it in his own books. He turned to *yomihon*, longer and more moral books for reading.
      He died in 1816. His caricature of Tsutaya, drawn in 1791, is the publisher’s best-known likeness, and it is on Tsutaya’s card.
    works: [portrait-tsutaya]
    links:
      - {to: tsutaya, rel: "published by; drew a caricature of"}
      - {to: sadanobu, rel: "manacled under the reforms of"}
    life:
      - {y: 1791, t: "Handcuffed fifty days"}
      - {y: 1793.7, t: "Opens a tobacco shop in Ginza"}
    sources: [wiki-kyoden, sa-tsutaya, suntory-tsutaya]

