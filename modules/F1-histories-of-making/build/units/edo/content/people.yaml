# The cast, grouped by role. The organiser comes first because the trade put him first.
# born/died drive the timeline's lifespan bars; "~" marks an approximate year.
# Main cast carry a character card: role, bet (one line), three highlights with a confidence word,
# a story of 120–220 words, works (images in this unit), connections, life ticks, map places and sources.
# Names in Japanese order. Publishers without a reliable likeness carry their trade mark in a hanko frame.
groups:
  - id: publishers
    title: Publishers
    kanji: 版元
    note: "They planned the title, paid for blocks, paper and labour, applied to the censor and sold the sheets. From 1790 the law held them answerable."
  - id: designers
    title: Designers
    kanji: 絵師
    note: "They drew the picture that the carver cut through and destroyed. Theirs is usually the only name on the sheet."
  - id: makers
    title: Carvers and printers
    kanji: 彫師・摺師
    note: "The two most skilled trades in the chain, and the least recorded. Five are named here because one record named them."
  - id: state
    title: The state
    kanji: 公儀
    note: "It licensed the subjects, stamped the blocks, capped the price and moved the theatres."
  - id: witnesses
    title: Writers, actors and witnesses
    kanji: 戯作者・役者
    note: "The people inside the pictures and the people who wrote down what the trade did."
  - id: afterlife
    title: Dealers and collectors
    kanji: 画商
    note: "The second trade: the people who bought, shipped, sold, copied and gave away."

people:
  tsutaya:
    name: Tsutaya Jūzaburō
    kanji: 蔦屋重三郎
    group: publishers
    born: 1750
    died: 1797
    img: portrait-tsutaya
    cap: "Santō Kyōden, caricature of Tsutaya, 1791 · National Diet Library via Wikimedia Commons · public domain (PD-Japan)"
    line: "Born in the Yoshiwara. Publisher of Utamaro, Kyōden and every Sharaku. Fined half of everything he owned in 1791."
    role: Publisher
    bet: "That the city would pay for the glamour of the quarter he grew up in."
    highlights:
      - {t: "Published the Yoshiwara guide alone from 1776", conf: documented}
      - {t: "Published Utamaro, Kyōden and every Sharaku", conf: documented}
      - {t: "Fined half of everything he owned, 1791", conf: documented}
    story: |
      Tsutaya Jūzaburō was born in the Yoshiwara on 13 February 1750 and adopted into the Kitagawa family. “Tsutaya”, Ivy Shop, was a shop name, not a surname.
      In 1774 he opened a bookshop on the Gojikken road to the quarter’s gate. His first books were guides to the pleasure quarter. From 1776 he published the *Yoshiwara saiken* alone.
      In 1783 he moved into the city, to Tōri Abura-chō. He widened his list: comic poetry, picture books, and the writers and designers who sold them. Utamaro lived in his house from about 1783 (probable).
      The Kansei reforms caught him in 1791. Kyōden was manacled and Tsutaya was fined half his property. He answered with luxury: Utamaro’s mica portraits, then, in 1794, Sharaku’s ten months of actors.
      He died in 1797, aged 47; some sources say of beriberi. His shop kept his name.
    works: [utamaro-tsutaya, sharaku, printshop]
    links:
      - {to: utamaro, rel: published}
      - {to: kyoden, rel: published}
      - {to: sharaku, rel: published}
      - {to: hokusai, rel: "published early work"}
      - {to: sadanobu, rel: "fined under his reforms"}
    life:
      - {y: 1774, t: "Bookshop at the quarter’s gate"}
      - {y: 1776, t: "Publishes the Yoshiwara guide alone"}
      - {y: 1783, t: "Moves to Tōri Abura-chō"}
      - {y: 1791, t: "Fined half his property"}
      - {y: 1794.4, t: "Sharaku’s actors"}
    map: {scale: city, ids: [yoshiwara-gate, toriaburacho]}
    sources: [wiki-tsutaya, suntory-tsutaya, sa-tsutaya, wiki-utamaro]

  nishimuraya:
    name: Nishimuraya Yohachi (Eijudō)
    kanji: 西村屋与八
    group: publishers
    born: ~1751
    died: ~1860
    mark: 永寿
    line: "The Eijudō firm at Bakuro-chō. Published Hokusai’s Thirty-six Views in the new blue, 1831."
    role: Publisher
    bet: "That a series of landscapes would sell on a new blue."
    highlights:
      - {t: "Issued the Thirty-six Views of Mount Fuji from 1831", conf: documented}
      - {t: "Advertised “more than one hundred” views", conf: documented}
      - {t: "Several generations used the name", conf: probable}
    story: |
      Nishimuraya Yohachi ran the Eijudō publishing house in Bakuro-chō. Several generations used the name, so the dates on this card are approximate (probable).
      Eijudō published Hokusai’s *Thirty-six Views of Mount Fuji*. By the bookseller Tōho’s account, he issued it in the new Prussian blue after an all-blue fan by Eisen had started a fad in 1829.
      The series was, Tōho wrote, “a great fad, double that of the fans.”
      His advertisement, printed for New Year 1831, promised one view to a sheet and “more than one hundred, without being limited to thirty-six”. He stopped at forty-six.
      That was the bet: a cheap imported colour, a famous mountain, and a designer past seventy. The Great Wave was one sheet of it, and so was Red Fuji.
      No likeness of him is known, so his card carries his firm’s name in a seal frame.
    works: [hi-wave, redfuji]
    links:
      - {to: hokusai, rel: published}
      - {to: eisen, rel: "followed his fan’s fad"}
      - {to: toho, rel: "recorded by"}
    life:
      - {y: 1829, t: "The blue fan fad begins"}
      - {y: 1831, t: "New Year advertisement for the Fuji series"}
    map: {scale: city, ids: [bakurocho]}
    sources: [smith-blue, sumida-producers, korenberg-fuji, vermeulen]

  iseya:
    name: Iseya Sōbei
    kanji: ""
    group: publishers
    line: "Fan-maker. Put out Keisai Eisen’s all-blue fan in 1829 and started the fad, by Tōho’s account."
  hoeido:
    name: Takenouchi Magohachi (Hōeidō)
    kanji: 竹内孫八
    group: publishers
    line: "Published Hiroshige’s Fifty-three Stations of the Tōkaidō, 1833–34."

  uoya:
    name: Uoya Eikichi
    kanji: 魚屋栄吉
    group: publishers
    mark: 魚栄
    line: "Published Hiroshige’s One Hundred Famous Views of Edo, 1856–58. His seal reads Shitaya, Uoei."
    role: Publisher
    bet: "That a hundred views of one city would sell, sheet by sheet, for years."
    highlights:
      - {t: "Published the One Hundred Famous Views of Edo, 1856–58", conf: documented}
      - {t: "His mark reads 下谷 魚栄, Shitaya, Uoei", conf: documented}
      - {t: "Each sheet carries aratame and a date seal", conf: documented}
    story: |
      Uoya Eikichi was a publisher in Shitaya, in the north of the city. His mark on the margin reads 下谷 魚栄, Shitaya, Uoei.
      Almost everything known about him comes from the sheets he paid for. Between 1856 and 1858 he issued Hiroshige’s *One Hundred Famous Views of Edo*: 118 views, and a title page by another hand.
      It was a bet on scale. Each sheet needed its own blocks, carvers and printers, and its own approval: an *aratame* seal and a seal giving the year and month.
      Those seals now date the series sheet by sheet. *Sudden Shower over Shin-Ōhashi* carries 巳九, the ninth month of the Snake year, 1857.
      Hiroshige died in 1858, while the set was being finished. The series outlived them both. Van Gogh copied two of its sheets in Paris in 1887.
      No likeness of Uoya is known, so his card carries his mark.
    works: [shower, plum]
    links:
      - {to: hiroshige, rel: published}
      - {label: "the censor", rel: "seals approved by"}
      - {to: vangogh, rel: "two sheets copied by"}
    life:
      - {y: 1856, t: "The Hundred Views begin"}
      - {y: 1857.7, t: "Sudden Shower, 9th month"}
      - {y: 1858, t: "Hiroshige dies"}
    sources: [hiroshige-uk, wiki-100views, jaanus-aratame, vgm-japan]

  eirakuya:
    name: Eirakuya Tōshirō
    kanji: 永楽屋東四郎
    group: publishers
    line: "A Nagoya house. Published the Hokusai Manga from 1814."
  shioya:
    name: Shioya Chōbei
    kanji: ""
    group: publishers
    line: "Osaka. Granted the sole right to publish actor likenesses in the 8th month of 1793."

  moronobu:
    name: Hishikawa Moronobu
    kanji: 菱川師宣
    group: designers
    born: 1618
    died: 1694
    line: "Signed his book pictures from 1672. The earliest known single-sheet prints follow."
  masanobu:
    name: Okumura Masanobu
    kanji: 奥村政信
    group: designers
    born: 1686
    died: 1764
    line: "Edo designer of perspective prints. His kabuki theatre of 1748, an uki-e, is in the Met."
  harunobu:
    name: Suzuki Harunobu
    kanji: 鈴木春信
    group: designers
    born: ~1725
    died: 1770
    line: "The designer the poetry circles chose for the full-colour calendars of 1765. No likeness of him survives."
  shunsho:
    name: Katsukawa Shunshō
    kanji: 勝川春章
    group: designers
    born: 1726
    died: 1793
    line: "Actors with recognisable faces. Hokusai’s first teacher."

  utamaro:
    name: Kitagawa Utamaro
    kanji: 喜多川歌麿
    group: designers
    born: ~1753
    died: 1806
    img: portrait-utamaro
    cap: "Portrait attributed to Chōbunsai Eishi, 1815 · British Museum via Wikimedia Commons · public domain"
    line: "Bust portraits of women for Tsutaya in the 1790s. Manacled for fifty days in 1804; dead in 1806."
    role: Designer
    bet: "That a face, close up, could sell a sheet."
    highlights:
      - {t: "Bust portraits of women for Tsutaya, 1790s", conf: documented}
      - {t: "More than 2,000 known prints", conf: documented}
      - {t: "Manacled fifty days in 1804", conf: documented}
    story: |
      Little is known of Kitagawa Utamaro’s early life. His birthplace is given as Kyoto, Osaka, Edo or Kawagoe, and none is verified. As a boy he studied with the painter Toriyama Sekien.
      In the mid-1780s, probably 1783, he went to live with Tsutaya Jūzaburō. The partnership made him.
      In the 1790s he designed *ōkubi-e*, large-headed pictures of beautiful women, often on a glittering ground of powdered mica.
      The censors pursued the genre. From 1793 prints could name no women but courtesans, and from 1800 large bust portraits of women were banned.
      In 1804 he was manacled for fifty days for prints of the warlord Toyotomi Hideyoshi, a forbidden subject. He died on 31 October 1806.
      More than two thousand of his prints are known. He was one of few ukiyo-e designers famous across Japan in his lifetime.
    works: [utamaro-tsutaya]
    links:
      - {to: tsutaya, rel: "published by"}
      - {label: "the censor", rel: "kiwame seal from"}
      - {label: "the state", rel: "manacled by, 1804"}
    life:
      - {y: 1783, t: "Lives with Tsutaya (probable)"}
      - {y: 1793, t: "Ten Aspects of Women’s Physiognomy"}
      - {y: 1800, t: "Bust portraits of women banned"}
      - {y: 1804, t: "Manacled fifty days"}
    map: {scale: city, ids: [toriaburacho]}
    sources: [wiki-utamaro, cma-utamaro, vjp-sumptuary]

  sharaku:
    name: Tōshūsai Sharaku
    kanji: 東洲斎写楽
    group: designers
    born: 1794
    died: 1795
    mark: 写楽
    line: "About 140 actor prints in ten months of 1794–95, all published by Tsutaya. Identity unknown."
    role: Designer
    bet: "That a buyer wanted the actor’s real face, not an ideal one."
    highlights:
      - {t: "About 144 actor portraits in ten months", conf: documented}
      - {t: "Every one published by Tsutaya", conf: documented}
      - {t: "Identity: no theory widely accepted", conf: contested}
    story: |
      Tōshūsai Sharaku appears in the fifth month of 1794 and is gone by the first month of 1795. Neither his real name nor his dates are known; the bar on the timeline marks only his working months.
      In those ten months Tsutaya published about 144 of his portraits of kabuki actors, which historians divide into four periods.
      The first, large heads on a dark mica ground, survive in the most copies, which suggests they sold best. Many later designs survive in a single copy.
      His actors are not flattered. Contemporaries such as Utamaro idealised their subjects; Sharaku showed the jowls and the strain. Then the work stopped.
      Dozens of identities have been proposed: an obscure poet, the Noh actor Saitō Jūrōbei, even Hokusai. Few are taken seriously, and none is widely accepted.
      His fame came late: he was rarely mentioned in print until Julius Kurth’s book of 1910.
    works: [sharaku]
    links:
      - {to: tsutaya, rel: "published by"}
      - {to: utamaro, rel: "rival in style"}
    life:
      - {y: 1794.4, t: "First actor portraits, 5th month"}
      - {y: 1795.05, t: "Last designs, 1st month"}
    map: {scale: city, ids: [sakaicho, fukiyacho]}
    sources: [wiki-sharaku, aic-sharaku, met-sharaku]

  ryukosai:
    name: Ryūkōsai Jokei
    kanji: 流光斎如圭
    group: designers
    line: "Osaka. Never signed the prints Shioya published from his designs, and withdrew."

  hokusai:
    name: Katsushika Hokusai
    kanji: 葛飾北斎
    group: designers
    born: 1760
    died: 1849
    img: portrait-hokusai
    cap: "Keisai Eisen, portrait of Hokusai · Wikimedia Commons · public domain (PD-Japan)"
    line: "Trained to cut woodblocks between 16 and 19. The Manga from 1814; the Fuji series from 1831."
    role: Designer
    bet: "That a lifetime of drawing could still be improving at ninety."
    highlights:
      - {t: "Trained as a block-cutter, aged 16–19", conf: documented}
      - {t: "Known by at least thirty names", conf: documented}
      - {t: "Thirty-six Views of Mount Fuji, c. 1830–32", conf: documented}
    story: |
      Katsushika Hokusai was born in Edo in 1760. As a teenager he trained to cut woodblocks, then entered the studio of the actor-print designer Katsushika Shunshō.
      He used at least thirty names in his life, changing them as his work changed. The Great Wave is signed with one of them, Iitsu.
      His *Manga* sketchbooks began in 1814. The *Thirty-six Views of Mount Fuji*, for Eijudō, followed around 1830–32, when he was past seventy.
      He knew the trade’s other hands. In 1835 he gave up his share of a carving fee to secure the carver Egawa Tomekichi.
      In 1834 he wrote that at a hundred and ten “each dot, each line will possess a life of its own”. He died on 10 May 1849, reportedly asking for five more years.
      His output is put at more than thirty thousand paintings, sketches, prints and book pictures. His daughter Ōi painted beside him.
    works: [hi-wave, redfuji, manga, printshop]
    links:
      - {to: shunsho, rel: "trained under"}
      - {to: tsutaya, rel: "early work published by"}
      - {to: nishimuraya, rel: "Fuji series published by"}
      - {to: eirakuya, rel: "Manga published by"}
      - {to: oi, rel: "father of"}
      - {to: egawa, rel: "paid to secure"}
      - {to: eisen, rel: "portrait drawn by"}
    life:
      - {y: 1776, t: "Training as a block-cutter"}
      - {y: 1814, t: "Manga, volume one"}
      - {y: 1831, t: "Thirty-six Views of Mount Fuji"}
      - {y: 1834, t: "“At a hundred and ten…”"}
      - {y: 1835, t: "Letter about the carver Egawa"}
    map: {scale: kanto, ids: [kanagawa, fuji, edo]}
    sources: [wiki-hokusai, bm-manga, met-wave, wiki-egawa]

  oi:
    name: Katsushika Ōi
    kanji: 葛飾応為
    group: designers
    born: ~1800
    died: ~1857
    mark: 応為
    line: "Hokusai’s daughter. About ten works confirmed as hers. Her hand is inside work signed “Hokusai” (probable)."
    role: Painter
    bet: "That a hand could work for years inside a famous man’s name."
    highlights:
      - {t: "About ten works confirmed as hers", conf: documented}
      - {t: "Painted in her father’s studio", conf: documented}
      - {t: "Her hand in work signed “Hokusai”", conf: probable}
    story: |
      Katsushika Ōi was Hokusai’s daughter. Her dates are uncertain: she was born around 1800 and is last recorded in the 1850s (probable).
      She worked as a painter in her father’s studio for most of her life. Only about ten works are confirmed as hers, among them the *Night Scene in the Yoshiwara*, with its lantern light and deep shadow.
      Hokusai “is reported to have said” that her pictures of women were better than his.
      Orders sent to “Hokusai” could be painted by father or daughter and signed with his name (probable).
      That makes her the clearest case in this story of a hand hidden by the trade’s naming rules. One historian argues that her hand was made to vanish, “for profit”.
      No reliable likeness of her survives, so her card carries her art name in a seal frame. The Ōta Memorial Museum showed her night scene in 2023.
    works: [oi-night]
    links:
      - {to: hokusai, rel: "daughter of; painted in his studio"}
    life:
      - {y: 1800, t: "Born, around this year (probable)"}
      - {y: 1845, t: "Night Scene in the Yoshiwara (approximate)"}
      - {y: 1849, t: "Hokusai dies"}
    sources: [ota-oi, davis-oi, prodig-oi, wiki-oi]

  eisen:
    name: Keisai Eisen
    kanji: 渓斎英泉
    group: designers
    born: 1790
    died: 1848
    img: portrait-eisen
    cap: "Self-portrait, 1836 · Wikimedia Commons · public domain"
    line: "His all-blue fan of 1829 started the fad. Van Gogh copied one of his courtesans."
    role: Designer
    bet: "That one imported colour, in gradations, was enough."
    highlights:
      - {t: "His all-blue fan of 1829 started the fad", conf: documented}
      - {t: "Began the Kisokaidō series that Hiroshige finished", conf: documented}
      - {t: "Van Gogh copied one of his courtesans", conf: documented}
    story: |
      Keisai Eisen was born in Edo in 1790, the son of a noted calligrapher of the Ikeda family. He trained with the Kanō painter Hakkeisai, who gave him the name Keisai, and then with Kikukawa Eizan.
      He is best known for *bijin-ga*, pictures of beautiful women, drawn as more worldly than earlier designers had drawn them.
      In 1829 the fan-maker Iseya Sōbei put out his fan printed in shades of Prussian blue alone. By Tōho’s account it was a sensation. The fad that followed carried Hokusai’s Fuji series.
      Later he designed the first eleven sheets of the *Sixty-nine Stations of the Kisokaidō*, before Hiroshige took the series over.
      He also wrote, including lives of the forty-seven rōnin and a history of the floating-world prints. He drew the portrait of Hokusai on Hokusai’s card.
      He died in 1848. In 1887 Van Gogh copied one of his courtesans in oil.
    works: [eisen-aizuri, portrait-hokusai, portrait-eisen]
    links:
      - {to: iseya, rel: "fan published by"}
      - {to: hiroshige, rel: "Kisokaidō finished by"}
      - {to: hokusai, rel: "drew a portrait of"}
      - {to: vangogh, rel: "copied by"}
    life:
      - {y: 1829, t: "The all-blue fan"}
      - {y: 1836, t: "Self-portrait"}
    sources: [wiki-eisen, smith-blue, vgm-japan]

  hiroshige:
    name: Utagawa Hiroshige
    kanji: 歌川広重
    group: designers
    born: 1797
    died: 1858
    img: portrait-hiroshige
    cap: "Utagawa Kunisada, memorial portrait of Hiroshige, 1858 · The Met, CC0"
    line: "The Tōkaidō of 1833–34. The Hundred Famous Views of Edo, 1856–58."
    role: Designer
    bet: "That travellers and townspeople would buy the places they knew."
    highlights:
      - {t: "Fifty-three Stations of the Tōkaidō, 1833–34", conf: documented}
      - {t: "One Hundred Famous Views of Edo, 1856–58", conf: documented}
      - {t: "More than 8,000 works", conf: documented}
    story: |
      Utagawa Hiroshige was born Andō Tokutarō in Edo in 1797. His father was a fire warden for the Yayosu quay.
      He studied under Utagawa Toyohiro. His breakthrough was the *Fifty-three Stations of the Tōkaidō*, published by Hōeidō in 1833–34: fifty-five sheets of the road from Nihonbashi to Kyoto.
      Series of famous places followed, for Osaka in 1834, Lake Biwa in 1834 and Kyoto in 1835. He finished the *Sixty-nine Stations of the Kisokaidō*, begun by Keisai Eisen.
      His last great project was the *One Hundred Famous Views of Edo* for the publisher Uoya Eikichi, 1856–58. Its 118 sheets show the city from spots you could walk to.
      He died in 1858, aged 62, during an epidemic of cholera in Edo; whether it killed him is unknown. He left more than eight thousand works. In 1887 Van Gogh copied two.
    works: [shower, plum, nihonbashi, t-kanagawa, t-hakone, t-kanbara, yoshiwara-nakanocho]
    links:
      - {to: hoeido, rel: "Tōkaidō published by"}
      - {to: uoya, rel: "Hundred Views published by"}
      - {to: eisen, rel: "finished a series begun by"}
      - {to: vangogh, rel: "copied by"}
      - {to: wright, rel: "shown in Chicago by"}
    life:
      - {y: 1833.5, t: "The Tōkaidō"}
      - {y: 1835, t: "Famous Places of Kyoto"}
      - {y: 1856, t: "The Hundred Views begin"}
    map: {scale: japan, route: tokaido}
    sources: [wiki-hiroshige, hiroshige-uk, wiki-tokaido, wiki-100views]

  kuniyoshi:
    name: Utagawa Kuniyoshi
    kanji: 歌川国芳
    group: designers
    born: 1798
    died: 1861
    img: portrait-kuniyoshi
    cap: "Utagawa Yoshiiku, memorial portrait of Kuniyoshi, 1861 · British Museum via Wikimedia Commons · public domain"
    line: "Warriors from 1827, cats always. 408,000 sheets of loyal retainers in eight months."
    role: Designer
    bet: "That warriors, cats and ghosts could say what actors no longer could."
    highlights:
      - {t: "Breakthrough with the Suikoden heroes, 1827", conf: documented}
      - {t: "408,000 sheets of loyal retainers, 1847–48", conf: documented}
      - {t: "Cats in place of people in comic prints", conf: documented}
    story: |
      Utagawa Kuniyoshi was born on 1 January 1798, the son of a silk-dyer. At about twelve his drawing caught the eye of the designer Utagawa Toyokuni, who took him on.
      His breakthrough came in 1827 with a series of heroes from the popular *Suikoden*. Warriors became his genre.
      The Tenpō reforms banned actors and courtesans from single sheets. Kuniyoshi made the most of what was left. He drew cats in the place of people, ghosts and monsters, and comic pictures that disguised real actors.
      Some were read as criticism of the shogunate, such as an 1843 design of a sleeping warrior haunted by demons.
      In 1847 his fifty-one loyal retainers sold eight thousand sets, 408,000 sheets, by the Fujiokaya diary’s count.
      He died at home in Genyadana in April 1861, aged 63.
    works: [gishi, cat]
    links:
      - {to: murata, rel: "approved by (censor)"}
      - {to: fujiokaya, rel: "sales recorded in"}
      - {to: tadakuni, rel: "worked around the reforms of"}
    life:
      - {y: 1827, t: "Suikoden heroes"}
      - {y: 1842.5, t: "The Tenpō ban"}
      - {y: 1843, t: "The earth-spider design"}
      - {y: 1847.6, t: "Loyal retainers: 8,000 sets"}
    sources: [wiki-kuniyoshi, fujiokaya, kato-1847]

