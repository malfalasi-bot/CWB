  wright:
    name: Frank Lloyd Wright
    kanji: ""
    group: afterlife
    born: 1867
    died: 1959
    img: portrait-wright
    cap: "Photograph, 1926 · Library of Congress via Wikimedia Commons · public domain"
    line: "Architect and print dealer. A Hiroshige show in Chicago, 1906; a scandal, 1920."
    role: Architect and dealer
    bet: "That Japanese prints were a lesson in design, and a business."
    highlights:
      - {t: "Lent the Art Institute a Hiroshige exhibition, 1906", conf: documented}
      - {t: "A Spaulding commission grew to $125,000 in 1913", conf: documented}
      - {t: "Refunded about $30,000 after the “revamped” prints", conf: documented}
    story: |
      Frank Lloyd Wright went to Japan in 1905 and came back a collector. In 1906 he lent the Art Institute of Chicago a whole exhibition of Hiroshige prints.
      For about twenty years he also dealt in them. In 1913 a commission from the Boston collectors William and John Spaulding grew from twenty thousand dollars to 125,000 in five months.
      A *Plum Garden at Kameido* in Chicago records him as the seller to Kate Buckingham, in February 1915.
      In 1919–20 some prints he had sold proved “revamped”: faded impressions recut and recoloured. The fraud was traced to a Tokyo dealer and a collector. Wright refunded about thirty thousand dollars.
      In 1928 his bank seized his house, and thousands of his prints sold at a dollar each.
      The Hammer Museum’s exhibition of 2005 traced what the prints taught his architecture.
    works: [plum]
    links:
      - {to: hiroshige, rel: "showed in Chicago"}
      - {label: "the Spauldings", rel: "sold to"}
      - {label: "Kate Buckingham", rel: "sold to"}
      - {label: "a Tokyo dealer", rel: "deceived by"}
    life:
      - {y: 1905, t: "First visit to Japan"}
      - {y: 1906.2, t: "Hiroshige show, Chicago"}
      - {y: 1913, t: "The Spaulding commission"}
      - {y: 1920, t: "The revamped prints"}
      - {y: 1928, t: "Prints sold at a dollar"}
    map: {scale: world, ids: [chicago, boston]}
    sources: [aic-1906, metbull-wright, aic-plum, vjp-takamizawa, hammer-wright]
