      options: ["Yes, a tsunami", "No: a storm wave about ten metres high", "No: a river bore"]
      answer: 1
      explain: "Scientists who studied it read a plunging storm wave, about ten metres high and three kilometres offshore. Tsunamis travel low out at sea."
