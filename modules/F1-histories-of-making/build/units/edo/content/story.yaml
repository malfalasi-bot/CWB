        Compare three originals under the loupe.
    - id: b4-5
      kind: argued
      year: 1834
      show: [e1831, e1835]
      stage: {mode: time, range: [1755, 1855], lanes: [print, trade], lifespans: [hokusai, oi, nishimuraya]}
