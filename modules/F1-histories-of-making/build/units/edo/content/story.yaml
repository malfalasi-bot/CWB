        options: ["Hokusai, with the Wave", "A fan-maker, with an Eisen fan", "The Dutch, with a gift to the shogun"]
        answer: 1
        explain: "Iseya Sōbei’s Eisen fan of 1829. Eijudō followed with Hokusai’s Fuji series."
        resolve: {events: [e1829, e1831]}

  - id: s4
