  kicker: Act II · 1807–1835 · Nishimuraya Yohachi (Eijudō)
  segments:
  - id: s3
    title: The old man and the pigment
    predict:
      q: "Where was the blue in a Great Wave sold in 1831 made?"
      options: ["In Japan", "In the Netherlands only", "Abroad: in Europe and, by then, mostly in China"]
      answer: 2
