# Edo and the floating world — the script (v4).
# Rules (enforced by scripts/build-content.mjs): beats of 40–100 words; no sentence over 25 words;
# one instrument state per beat, never the same twice running; every beat lists its sources;
# at most one guess per scene, never on its first or last beat, answered by the beat that follows it.
# Markup: [[id]] or [[id|label]] links a cast member; *italic*; **bold**; 「」 for Japanese quotation.

unit:
  title: Edo and the floating world
  kanji: 浮世
  question: "How did a city turn pictures into a mass market, and who got named when it did?"

overture:
  shots:
    - id: paper
      text: "Edo, 1603–1868. A city of over a million learned to sell pictures for the price of a bowl of noodles."
      alt: "Washi paper. The characters 浮世, the floating world, bleed into it like ink."
    - id: wave
      text: "Around 1831 a publisher bet a series on an imported blue. Hokusai, past seventy, gave him this wave."
      alt: "Hokusai’s Great Wave, separated into five layers of depth: sky, far swell, near swell, the wave, the foam."
    - id: shop
      text: "Prints were products: planned, paid for and sold from shops like this one, drawn by Hokusai in 1802."
      alt: "Hokusai’s picture of a print shop, sheets hanging at the front and books piled on the floor."
    - id: blocks
      text: "One sheet, many hands: a designer drew it, a carver cut the blocks, a printer pulled each colour."
      alt: "The Wave’s colour layers, a reconstruction, dropping one by one onto the registration marks."
    - id: edo
      text: "Publishers clustered in Edo’s centre. Their prints followed the Tōkaidō, the lords’ road to Kyoto."
      alt: "The 1859 map of Edo tilting flat, with the road west drawing itself."
    - id: seal
      text: "From 1790 every design needed a censor’s seal. In 1842 the state banned the trade’s two best sellers."
      alt: "A round seal reading 極, kiwame, examined, stamped in red."
    - id: sea
      text: "After the ports opened, dealers shipped the sheets to Paris, where Bing’s Le Japon artistique presented them as art."
      alt: "A route drawn from Yokohama to Paris, and the cover of Le Japon artistique."
    - id: return
      text: "In 2024 the wave came home on Japan’s thousand-yen note. A cheap print had become money."
      alt: "The Great Wave inside a schematic banknote outline. The note itself is not shown."
    - id: contents
      text: "Five bets, five acts. Choose where to begin, or keep scrolling."
      alt: "Five stacked blocks, one for each act."

acts:
- id: p
  n: ""
  title: A wave in your wallet
  kicker: Prologue · 2024
  segments:
  - id: s0
    title: The question
    beats:
    - id: p-1
      kind: opener
      year: 2024.5
      show: [e2024]
      stage: {mode: object, img: hi-wave, region: [0, 0, 1, 1], full: true}
      sources: [boj-note, npb-1000, bm-spot, met-wave-record, nippon-soba]
      text: |
        On 3 July 2024 Japan issued a new thousand-yen note. On its back is this wave, caught just before it breaks, with Mount Fuji small behind it.
        The picture was printed in Edo around 1831. It sold for about the price of a bowl of noodles.
        Eleven years later, the state that now prints it on money banned half of what the trade sold, and capped the price of the rest.
    - id: p-2
      year: 2024.5
      show: [e1765, e1831, e1842, e1889, e2024]
      stage: {mode: time, range: [1600, 2025], acts: true}
      sources: [wiki-ukiyoe, met-ukiyoe]
      text: |
        This unit asks one question. **How did a city turn pictures into a mass market, and who got named when it did?**
        You will follow five publishers’ bets, one to an act, and one sheet of paper from Echizen to New York.
        The map and the timeline move as you read. Every person you meet joins the Cast, bottom left.

- id: a1
  n: "I"
  title: The quarter’s publisher
  kicker: Act I · 1603–1806 · Tsutaya Jūzaburō
  years: "1603–1806"
  bet: "A publisher born in the pleasure quarter bets that a city of a million will pay for its glamour, and answers a fine with luxury."
  hero: {mode: object, img: printshop, region: [0, 0.05, 1, 0.6], full: true}
  segments:
  - id: s1
    title: A city built to be an audience
    beats:
    - id: b1-1
      year: 1635
      show: [e1603, e1635]
      people: [ieyasu]
      stage: {mode: map, scale: japan, view: [129.5, 31.5, 142.5, 38.5], points: [edo, kyoto, osaka, nagasaki], route: tokaido-faint}
      sources: [wiki-edo, christies-edo]
      text: |
        In 1603 [[ieyasu]] became shogun and made Edo, a castle town on a marshy bay, the seat of his government.
        The emperor stayed in Kyoto. Osaka stayed the country’s warehouse.
        From 1635 every lord in Japan had to live in Edo in alternate years, leaving his wife and heir behind when he went home.
        Their processions filled the roads. Their households filled the city.
    - id: b1-2
      year: 1657
      show: [e1657]
      stage: {mode: map, scale: city, focus: [hongo, koishikawa, kojimachi, castle], anim: fire}
      sources: [wiki-meireki, tmg-census]
      text: |
        In the first month of 1657 a fire broke out at Honmyō-ji temple in Hongō, at about two in the afternoon.
        The next morning a second fire started in Koishikawa. That afternoon a third began in Kōjimachi.
        Between sixty and seventy per cent of the city burned, and the castle keep was never rebuilt.
        The dead are counted at anything from thirty thousand to a hundred thousand.
    - id: b1-3
      year: 1660
      note: quarter
      stage: {mode: map, scale: city, focus: [nihonbashi, ryogoku, honjo, yoshiwara], anim: yoshiwara-move}
      sources: [wiki-meireki, wiki-yoshiwara]
      text: |
        The rebuilt city spread east. A bridge at Ryōgoku crossed the Sumida, and the districts of Honjo and Fukagawa grew on the far bank.
        The fire also moved the licensed quarter. It had stood near Nihonbashi since 1617.
        After 1657 it was rebuilt in the rice fields north of Asakusa, behind a moat with a single gate, as the Shin-Yoshiwara.
    - id: b1-4
      year: 1700
      stage: {mode: map, scale: city, focus: [sakaicho, fukiyacho, kobikicho, yoshiwara, nihonbashi], pins: theatres}
      figure: {img: playbill, cap: "Picture book of play synopses for the Nakamura theatre, dated 1799 · Torii-school artist · The Met 2013.851 · CC0"}
      sources: [ndl-saruwaka, met-playbill, wiki-yoshiwara]
      guess:
        type: slider
        q: "In 1721 Edo counted itself. About how many people lived there?"
        scale: log
        min: 10000
        max: 10000000
        unit: people
        truth: 1300000
        truthLabel: "about 1.3 million"
        close: 2
        say: "About 1.3 million by the city’s own count, samurai and townspeople in nearly equal numbers. The buyers came before the pictures."
        sources: [tmg-census]
      text: |
        Edo’s leisure ran through two licensed businesses. Three kabuki theatres stood in the town centre, at Sakai-chō, Fukiya-chō and Kobiki-chō.
        The quarter stood at the edge.
        Both sold glamour to a city with time and money, and both needed advertising.
        Because the state licensed them, it could later ban them by name.
    - id: b1-4r
      year: 1721
      show: [e1721]
      stage: {mode: map, scale: city, focus: all}
      sources: [tmg-census, christies-edo]
      text: |
        In 1721 the shogunate counted the city. Edo held about 1.3 million people, samurai and townspeople in nearly equal numbers.
        It was among the largest cities anywhere.
        Half the city served the lords who came and went. The other half fed, clothed and amused them.
        A market for cheap pictures needed exactly this: crowds, cash and visitors who wanted to take something home.
    - id: b1-5
      year: 1672
      show: [e1672]
      people: [moronobu]
      stage: {mode: time, range: [1600, 1780], lanes: [print, state]}
      sources: [wiki-ukiyoe, met-ukiyoe]
      text: |
        Pictures had been printed from woodblocks in Japan for centuries, mostly Buddhist images and book illustrations.
        In the 1670s Edo began trading pictures as goods. [[moronobu]] signed his book pictures from 1672, and the earliest known single sheets follow.
        The trade called its subject *ukiyo*, the floating world: once a Buddhist word for a sorrowful world, now the world of passing pleasures.
    - id: b1-5u
      year: 1748
      show: [e1672, e1740]
      people: [masanobu]
      stage: {mode: time, range: [1600, 1780], lanes: [print, state], lifespans: [moronobu, masanobu, harunobu]}
      sources: [wiki-ukie, met-ukie]
      links: [{to: views, anchor: ukie, label: "Step inside the uki-e box"}]
      text: |
        The earliest known *uki-e*, “floating pictures”, date from about 1739–40.
        They used one-point perspective, learned from European engravings that reached Japan through Dejima or China.
        Designers favoured interiors, because perspective is easier to apply to architecture than to landscape.
        In 1748 [[masanobu]] drew a whole kabuki theatre, crowd and stage, running towards one vanishing point.
    - id: b1-6
      year: 1700
      stage: {mode: object, img: keyblock, region: [0, 0, 1, 1], marks: keyblock}
      sources: [vam-quartet, aam-process, jaanus-hosho]
      text: |
        A print was never one hand. The **publisher** planned it, paid for it, applied for permission and sold it.
        The **designer** drew it on thin paper. The **carver** pasted that drawing face down on cherry wood and cut through it, destroying it.
        The **printer** inked the blocks and rubbed each sheet by hand.
        This is a carver’s key block, pulled in black. The notches outside the picture registered every colour block that followed.
    - id: b1-7
      year: 1765
      show: [e1765, e1770]
      people: [harunobu]
      stage: {mode: object, img: harunobu-1765, region: [0, 0, 1, 1]}
      sources: [met-ukiyoe, hamatake-harunobu, vjp-poetry, met-harunobu]
      text: |
        Full colour arrived in a single year, and not from the trade.
        For New Year 1765, circles of amateur poets commissioned picture calendars to exchange at parties. They paid for the best designers, carvers and paper.
        Publishers then bought the blocks, cut out the patrons’ names and sold the sheets as *nishiki-e*, brocade pictures (probable).
        The poets’ favourite designer was [[harunobu]]. He had five years left to live.

  - id: s2
    title: Tsutaya’s gamble
    beats:
    - id: b2-1
      year: 1783
      show: [e1783]
      people: [tsutaya]
      stage: {mode: map, scale: city, focus: [yoshiwara, toriaburacho], anim: tsutaya-move}
      sources: [wiki-tsutaya, suntory-tsutaya, sumida-producers]
      text: |
        [[tsutaya]] was born in the Shin-Yoshiwara in 1750 and grew up there.
        His first business was a bookshop on the road to the quarter’s gate. His first product was its printed guide, the *Yoshiwara saiken*, which he came to publish alone.
        In 1783 he moved into the city, to Tōri Abura-chō by Nihonbashi, the street of the big houses.
        His seal was an ivy leaf under a three-peaked Fuji.
    - id: b2-2
      year: 1797
      stage: {mode: object, img: printshop, region: [0, 0, 1, 1]}
      sources: [tml-azuma, forrer-sellers, kornicki, hoover]
      text: |
        This is what a print shop looked like, drawn by Hokusai for a picture book of 1802. The Tokyo Metropolitan Library identifies it as Tsutaya’s own shop (probable).
        Sheets hang in the front, books lie in piles.
        Publishers sold from their shops, swapped stock with each other and supplied street sellers.
        Some 655 lending libraries carried books door to door in 1808.
    - id: b2-3
      year: 1790
      note: quarter
      stage: {mode: tool, tool: contract}
      figure: {img: yoshiwara-nakanocho, cap: "Utagawa Hiroshige, Cherry Blossom Time in Nakanochō, the quarter’s main street · LACMA via Wikimedia Commons · public domain"}
      people: [hanaogi]
      sources: [wiki-yoshiwara, sa-yoshiwara, met-hanaogi, world4-hanaogi, jf-1872]
      text: |
        The quarter’s women were there under contract. A typical indenture around 1800, signed by a father, exchanged a lump sum for years of service: for instance 25 ryō for five.
        Debts for food, clothes and medicine could extend the term.
        From 1793 the only women prints could name were courtesans. [[hanaogi]] wrote poetry admired in her day. In 1794 she ran away, and was brought back.
    - id: b2-4
      year: 1790
      show: [e1790]
      people: [sadanobu]
      stage: {mode: object, img: utamaro-tsutaya, region: [0, 0, 1, 1], marks: utamaro-seals}
      sources: [wiki-kansei, wiki-sadanobu, jaanus-aratame, vjp-seals, cma-utamaro]
      guess:
        type: tap
        q: "From 1790, whose marks on this sheet made them answerable to the law?"
        marks: utamaro-seals
        truth: [0, 2]
        say: "The designer’s signature and the publisher’s mark. The law named designer, writer and publisher; the carver and the printer appear nowhere on the sheet."
        sources: [vjp-seals, jaanus-aratame]
      text: |
        In 1787 [[sadanobu]] became chief councillor and began the Kansei reforms, after years of famine and spending.
        From the fifth month of 1790 publishers had to submit every design to censors chosen from their own guild.
        Approval was a small round seal reading *kiwame*, “examined”, cut into the key block.
        On this Utamaro, Tsutaya’s ivy leaf and the censor’s seal sit side by side.
    - id: b2-5
      year: 1791
      show: [e1790, e1791, e1800]
      people: [kyoden]
      stage: {mode: time, range: [1775, 1810], lanes: [state, trade, print], bands: true, lifespans: [tsutaya, utamaro, kyoden]}
      sources: [vjp-seals, sa-tsutaya, suntory-tsutaya, vjp-sumptuary, wiki-kyoden]
      text: |
        The law named three people for every sheet: the designer, the writer and the publisher. It never named the carver or the printer.
        It came with examples. In 1791 three of Kyōden’s books, published by Tsutaya, were judged offensive.
        [[kyoden]] was manacled for fifty days. Tsutaya was fined half of everything he owned.
        From 1800 large bust portraits of women were banned as “conspicuous”.
    - id: b2-6
      year: 1794.4
      show: [e1794]
      people: [utamaro, sharaku]
      stage: {mode: object, img: sharaku, region: [0, 0, 1, 1]}
      sources: [aic-sharaku, met-sharaku, wiki-tsutaya, wiki-sharaku]
      text: |
        Tsutaya answered the fine with luxury. [[utamaro]]’s bust portraits of women on powdered mica were the luxury prints of the decade.
        Then, in the fifth month of 1794, he issued actor portraits by an unknown designer signed [[sharaku]].
        About 140 designs followed in ten months, all for Tsutaya. Then nothing.
        Nobody knows who Sharaku was.
    - id: b2-7
      year: 1793
      show: [e1793]
      people: [shioya, ryukosai]
      stage: {mode: map, scale: japan, view: [133.5, 33.6, 137.4, 35.6], points: [osaka, kyoto], route: tokaido-faint}
      sources: [yano, ref-kamigata]
      text: |
        Osaka ran the same medium another way.
        In the eighth month of 1793 the publisher [[shioya]] won the sole right to publish actor likenesses. In 1794 he bought a rival artist’s blocks.
        That artist, [[ryukosai]], “never put his signature” on the prints Shioya made from his designs, and withdrew.
        In Osaka, fan clubs and poetry circles paid for much of the trade.
    - id: b2-8
      year: 1806
      show: [e1797, e1804]
      stage: {mode: time, range: [1780, 1815], lanes: [state, trade, print], bands: true, lifespans: [tsutaya, utamaro, sadanobu]}
      sources: [wiki-tsutaya, vjp-sumptuary, wiki-ukiyoe, wiki-utamaro]
      text: |
        Tsutaya died in 1797, aged 47. His shop went on under his name.
        In 1804 Utamaro was manacled for fifty days for a print of the warlord Hideyoshi, a subject the state treated as its own. He died two years later.
        The golden age ended in handcuffs twice.
        The censor now held the publisher answerable for every sheet. What would a publisher dare to bet on next?
  rebuild:
    mode: time
    range: [1600, 1810]
    q: Put Act I back on its timeline
    tiles:
      - {id: r1-a, label: "Lords live in Edo in alternate years", year: 1635, img: portrait-ieyasu, hint: "Early: the shogunate’s first decades."}
      - {id: r1-b, label: "The Meireki fire", year: 1657, hint: "Before the quarter moved north of Asakusa."}
      - {id: r1-c, label: "Full-colour calendars for the poets", year: 1765, img: harunobu-1765, hint: "Harunobu’s year: five before his death."}
      - {id: r1-d, label: "Tsutaya moves into the city", year: 1783, img: portrait-tsutaya, hint: "Before the seal, after Harunobu."}
      - {id: r1-e, label: "The kiwame seal", year: 1790, img: utamaro-tsutaya, hint: "The Kansei reforms: just before Kyōden’s manacles."}
      - {id: r1-f, label: "Sharaku’s ten months", year: 1794, img: sharaku, hint: "After the seal, before Tsutaya’s death."}

- id: a2
  n: "II"
  title: A bet on blue
  kicker: Act II · 1807–1835 · Nishimuraya Yohachi (Eijudō)
  years: "1807–1835"
  bet: "A publisher bets a landscape series on a cheap imported blue, and an old designer gives it the sheet the world remembers."
  hero: {mode: object, img: hi-wave, region: [0.02, 0.18, 0.62, 0.62], full: true}
  segments:
  - id: s3
    title: The old man and the pigment
    beats:
    - id: b3-1
      year: 1814
      show: [e1807]
      people: [hokusai, shunsho]
      stage: {mode: time, range: [1755, 1855], lanes: [print, trade], lifespans: [hokusai, shunsho, tsutaya]}
      sources: [bm-manga, sumida-producers, wiki-ukiyoe, lyon-publishers]
      text: |
        [[hokusai]] was born in Edo in 1760. Between 16 and 19 he trained to cut woodblocks.
        He then studied under the actor-print designer [[shunsho]], signing himself Shunrō, and Tsutaya published some of his early work.
        In 1807 Edo’s picture publishers formed a guild, the *jihon toiya*, which owned the blocks and policed copying.
        Hokusai would be over seventy before his most famous sheet.
    - id: b3-2
      year: 1814
      show: [e1814]
      people: [eirakuya]
      stage: {mode: object, img: manga, region: [0, 0, 1, 1]}
      sources: [bm-manga, met-manga, sumida-producers]
      text: |
        In 1814 a Nagoya publisher, [[eirakuya]], began issuing the *Hokusai Manga*. These were sketchbooks of people, animals, gods and things, sold as models for amateurs.
        This copy of the first volume is a later printing, after 1828.
        The books made Hokusai a brand outside Edo. Whether they make him the “father of manga” is still a question, even in a British Museum curator’s title.
    - id: b3-2g
      year: 1820
      stage: {mode: map, scale: world, rotate: 75, view: [-5, -40, 150, 58], points: [nagasaki, edo]}
      sources: [smith-blue, fitzhugh]
      guess:
        type: map
        q: "Where was the new blue first made? Tap the map."
        options:
          - {id: edo, label: Japan}
          - {id: canton, label: China}
          - {id: amsterdam, label: The Netherlands}
          - {id: berlin, label: Prussia}
        truth: [berlin, canton]
        primary: berlin
        closeKm: 1500
        say: "Berlin, around 1704. By the 1820s Chinese supply made it cheap (probable that it was made there). It was never made in Japan in this period."
        sources: [fitzhugh, smith-blue]
      text: |
        The Fuji series would be sold on a colour Edo could not make.
        Printers already had indigo from plants, but it printed dull and was hard to grade into a sky.
        The new blue was a chemical pigment, bright and steady, and it came from very far away.
        It reached Japan the only way foreign goods could: through the port of Nagasaki.
    - id: b3-3
      year: 1828
      show: [e1824]
      stage: {mode: map, scale: world, rotate: 75, view: [-5, -40, 150, 58], points: [berlin, amsterdam, cape, batavia, china, nagasaki, edo], route: blue}
      sources: [fitzhugh, smith-blue, voc-route, wiki-dejima]
      text: |
        Prussian blue was first made in Berlin around 1704, by accident: a colour-maker’s red came out blue.
        Edo called it *bero-ai*, “Berlin indigo”.
        Dutch ships brought it to Nagasaki via the Cape and Batavia.
        Then, from 1824, Chinese junks re-entered the trade “in steadily increasing quantities”, and the price began to fall.
    - id: b3-4
      kind: argued
      year: 1828
      show: [e1824, e1829]
      stage: {mode: time, range: [1780, 1840], lanes: [world, print], blueprice: true}
      sources: [artelino-aizuri, smith-blue, fitzhugh]
      argued:
        q: "When did Prussian blue reach Edo’s printers?"
        a: {title: "Around 1790", text: "One reading has it arriving through Dejima around 1790 and staying costly until about 1820.", conf: probable}
        b: {title: "In the late 1820s", text: "Another has it known but little used until Chinese imports from 1824 made it cheap enough for a sixteen-mon sheet.", conf: documented}
        evidence:
          - {t: "Nagasaki price, 1824: 87 monme a kin", conf: documented}
          - {t: "Price by 1828: 31 monme a kin", conf: documented}
          - {t: "The Dutch withdraw from the blue trade", conf: documented}
        verdict: b
        why: "The price fall is what turned a luxury into a print colour. It supports the later date for printers, without denying earlier arrivals."
      text: |
        Historians agree the blue came by sea. They disagree about when Edo’s printers could afford it.
        The line on the timeline is Henry Smith’s figure for the Chinese price at Nagasaki, from 87 to 31 monme of silver a kin.
        Read both positions, then decide which the price supports.
    - id: b3-5
      year: 1829
      show: [e1829]
      people: [eisen, iseya, toho]
      stage: {mode: object, img: eisen-aizuri, region: [0, 0, 1, 1]}
      sources: [smith-blue]
      text: |
        In 1829 the fan-maker [[iseya]] put out a fan by [[eisen]] printed in light and dark shades of the new blue alone.
        By the bookseller [[toho]]’s account it was a sensation, and other fan-makers flooded the market with all-blue fans.
        This Eisen sheet, from the early 1830s, is printed the same way: one imported colour, in gradations, on white paper.
    - id: b3-6
      year: 1831
      show: [e1831]
      people: [nishimuraya]
      stage: {mode: object, img: redfuji, region: [0, 0, 1, 1]}
      sources: [smith-blue, vermeulen, korenberg-fuji]
      text: |
        Then, Tōho says, [[nishimuraya]] of Bakuro-chō issued Hokusai’s *Thirty-six Views of Mount Fuji* in the new blue. It was “a great fad, double that of the fans.”
        His advertisement, printed for New Year 1831, promised one view to a sheet and “more than one hundred, without being limited to thirty-six”.
        Thirty-six became forty-six. This is Red Fuji, one of the earliest.

  - id: s4
    title: One sheet, many hands
    beats:
    - id: b4-0
      kind: opener
      year: 1831
      stage: {mode: object, img: hi-wave, region: [0.02, 0.18, 0.62, 0.62], full: true}
      sources: [met-wave, smith-blue]
      text: |
        This scene begins inside the wave. Look at the hollow under the claw, where three boats lie low in the water.
        That blue was new in 1831. It is the reason this sheet exists.
        Before it was a picture of anything, it was a product: a publisher’s bet, a pigment’s price and a workshop’s labour.
    - id: b4-1
      year: 1831
      stage: {mode: map, scale: kanto, view: [138.45, 34.95, 140.05, 35.85], points: [edo, kanagawa, fuji]}
      sources: [cartwright, dudley, met-wave]
      guess:
        type: choice
        q: "What did Hokusai draw rising over the boats?"
        options: ["A tsunami", "A storm wave"]
        truth: 1
        say: "A plunging storm wave, about ten metres high and about three kilometres offshore. A tsunami travels low out at sea."
        sources: [cartwright, dudley]
      text: |
        The title places the scene “off Kanagawa”, a post station on the bay road south of Edo. Fuji stands about eighty kilometres west.
        Three long boats ride a swell, their crews bent at the oars.
        The sea has been read many ways since. Scientists have measured it against what real water does.
    - id: b4-1r
      year: 1831
      stage: {mode: map, scale: kanto, view: [138.45, 34.95, 140.05, 35.85], points: [edo, kanagawa, fuji, yokohama-off], labels: {yokohama-off: "Storm wave · c. 10 m · c. 3 km out"}}
      sources: [cartwright, dudley]
      text: |
        Two scientists who studied the picture concluded Hokusai drew “an exceptionally large storm wave”, not a tsunami.
        A tsunami travels low and fast out at sea, and rises only near the shore.
        Another team put this wave near ten metres high, about three kilometres offshore.
        The drawing is exaggerated, and still faithful to water.
    - id: b4-2
      year: 1831
