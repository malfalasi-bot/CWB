<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/">
<title>Cast harness</title>
<link rel="stylesheet" href="/src/styles.css">
<style>
  .hx { position: fixed; right: 8px; bottom: 8px; z-index: 30; display: flex; gap: 4px; flex-wrap: wrap; max-width: 60vw; font: 500 11px var(--ui); }
  .hx button { font: 600 11px var(--ui); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--paper-2); cursor: pointer; }
  .lab-host { position: absolute; top: calc(var(--bar) + 8px); right: 16px; bottom: 12px; left: calc(var(--col) + var(--gut) + 28px); z-index: 3; }
  body.room .lab-host { position: fixed; inset: 0; padding: 64px max(16px, 4vw) 16px; background: var(--paper); z-index: 20; }
  @media (max-width: 820px) { .lab-host { left: 6px; right: 6px; bottom: 6px; } }
</style>
</head>
<body class="ready">
<header class="bar">
  <div class="bar-title"><span class="bar-kanji" aria-hidden="true">浮世</span><span>Cast &amp; instruments harness</span></div>
  <div class="bar-right"><div class="bar-year"><span class="y">1790</span></div></div>
</header>
<div id="stage" aria-label="Map, timeline and objects">
  <div class="layers">
    <div class="layer" id="layer-map"></div>
    <div class="layer" id="layer-time"></div>
    <div class="layer" id="layer-object"></div>
    <div class="layer" id="layer-tool"></div>
  </div>
  <div id="mini" class="mini"></div>
</div>
<main id="story" tabindex="-1"></main>
<div class="hx" id="hx"></div>
<script type="module" src="/harness/cast.js"></script>
</body>
</html>
