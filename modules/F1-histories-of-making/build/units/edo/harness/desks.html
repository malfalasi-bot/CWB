<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/">
<title>Desks harness</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/styles.css">
<style>
  body { min-height: 100vh; }
  .hx-room { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--paper) var(--tex); }
  .hx-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 16px; background: var(--paper-2); border-bottom: 1px solid var(--line-2); font: 600 13px var(--ui); }
  .hx-head a { color: var(--indigo); }
  .hx-body { flex: 1; min-height: 0; overflow: auto; padding: 20px var(--gut) 28px; display: flex; flex-direction: column; }
  .hx-body > .room-lab { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .hx-stage { position: fixed; inset: 0; display: grid; grid-template-columns: var(--col) 1fr; }
  .hx-story { padding: 80px 30px; font: 400 17px/1.6 var(--serif); color: var(--ink-2); border-right: 1px solid var(--line); }
  .hx-stage .lab-host { position: relative; margin: 66px 24px 72px 40px; display: flex; flex-direction: column; min-height: 0; }
  .hx-stage .lab-host > * { flex: 1 1 auto; min-height: 0; }
  @media (max-width: 820px) { .hx-stage { position: static; display: block; } .hx-story { padding: 16px; } .hx-stage .lab-host { margin: 0 8px 20px; } }
</style>
</head>
<body class="ready">
<script type="module" src="/harness/desks.js"></script>
</body>
</html>
