      actors: [ { ticks: listed, fired: none } ]
      labels: { primary: none, others: [] }
      dim: [lanes]
      caption:
        text: "The blue goes north, 1592 to 1659: the lane chart holds the invasions, the carracks, the dish, the edicts and the VOC's order."
        sources: [OCC071, OCC072, F1.13-C18, OCC077, OCC080]
        claim: [f13-e-imjin, f13-e-voc-order]
      duration: held
      reduced: still
