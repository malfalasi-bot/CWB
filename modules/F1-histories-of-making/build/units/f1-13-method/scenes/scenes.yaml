# F1.13 Networks: step 6 (storyboard), the four scenes to the schema in scenes.md §5.
# Written by Claude Fable 5.1, 20 October 2026, from research_notes/F1.13 method run/
# (research.md, benchmark.md, inventory.json, plan.md) and build/lectures/src/lectures/f1-13.json.
#
# Claim ids: f13-<inventory event id> (inventory.json events) or the register's F1.13-C01…C25.
# Place ids: the lecture's gazetteer (f1-13.json `places`), which carries a source line per point.
# Source ids: register claims (F1.13-Cnn) and canon rows (OCCnnn, NETnnn, DIAnnn) as inventory.json cites them.
# Every open object the scenes end on has no image in the repo (inventory.json `image_in_repo: false`):
# `ends_on` carries `frame: placeholder` and the holder's credit line; nothing is drawn or generated in its place.
#
# Two fields extend the §5 schema and are flagged in storyboard.md: `content_note` (the protocol's level-2 note,
# shown once before the first shot) and `clock.claim` (the register id behind a readout the caption does not carry).
# Where a caption carries two register values its `claim` is a list.

- id: f13-cobalt
  kind: journey
  title: The cobalt
  span: [1175, 1435]
  claims: [f13-e-kashan-bowl, f13-e-abulqasim, f13-e-jar, f13-e-xuande, F1.13-C02, F1.13-C04, F1.13-C05]
  surfaces: [globe-world, timeline, stage]
  understand: The jar's potters and clay were at Jingdezhen and its blue came from Iran, on a route the record does not give.
  honesty: >-
    The one leg, Kashan to Jingdezhen, is undated and drawn dashed; no stop between the ends is in the sources.
    Which mine gave the cobalt is contested (Qamsar or Anarak) and is a card with two pale dots, never a tick or a clock;
    Qamsar is not in the gazetteer and is placed 0.23° south of Kashan's point as "near Kashan".
    Nothing claims the Kashan bowl's blue and the jar's blue share one mine. The Xuande tests (1426–35) postdate the jar
    and are shown as the evidence they are. The jar's image is the holder's photograph, placed at build.
  guess: none          # station 1's predict ("Where did the blue come from?") has no id in f1-13.json; bind when lectures.yaml gives it one
  ends_on:
    object: cma-1962-154
    frame: placeholder
    text: "the holder's photograph, placed at build"
    holder: Cleveland Museum of Art
    accession: "1962.154"
    date: 1300s
    licence: CC0
  shots:
    - n: 1
      surface: globe-world
      camera: { move: settle, keep: [kashan] }
      clock: { mode: span, readout: "late 1100s – early 1200s", claim: f13-e-kashan-bowl }
      actors: [ { glyph: pigment, at: kashan } ]
      labels: { primary: kashan, others: [] }
      dim: [routes, marks]
      caption:
        text: "A footed bowl from Iran, with a blue rim: Cleveland dates it late 1100s to early 1200s and places it probably at Kashan."
        sources: [F1.13-C05]
        claim: f13-e-kashan-bowl
      duration: held
      reduced: cut
    - n: 2
      surface: globe-world
      camera: { move: hold }
      clock: { mode: point, readout: "1301", claim: f13-e-abulqasim }
      actors:
        - { mark: mentioned-place, at: qamsar }       # pale hollow dot, unlabelled; the card names it
        - { mark: mentioned-place, at: anarak }
        - { card: argument, id: a-cobalt-mine, claim: F1.13-C04 }   # contested: a card, never a tick
      labels: { primary: kashan, others: [] }
      dim: [routes, marks]
      caption:
        text: "Which mine gave the cobalt is argued: Qamsar, near Kashan, where Abu'l-Qasim's treatise of 1301 places lâjvard; or deposits near Anarak."
        sources: [F1.13-C04]
        claim: f13-e-abulqasim
      duration: held
      reduced: still
    - n: 3
      surface: globe-world
      camera: { move: follow, legs: [[kashan, jingdezhen]], per_leg: 1.2 }
      clock: { mode: span, readout: "late 1100s – 1300s", claim: [f13-e-kashan-bowl, f13-e-jar] }
      actors: [ { glyph: pigment, follow: legs, dated: false } ]     # dashed leg; a material, not an object
      labels: { primary: jingdezhen, others: [kashan], ink_as_drawn: true }
      dim: [routes, marks]
      caption:
        text: "Cleveland's record says the jar's cobalt was imported from Iran, likely from Kashan; the route is not recorded and is drawn dashed."
        sources: [F1.13-C02]
        claim: F1.13-C02
      duration: held
      reduced: fade
    - n: 4
      surface: globe-world
      camera: { move: hold }
      clock: { mode: span, readout: "1300s", claim: f13-e-jar }
      actors: [ { mark: object-holder, at: jingdezhen } ]
      labels: { primary: jingdezhen, others: [kashan] }
      dim: [routes, marks]
      caption:
        text: "Potters at Jingdezhen made the jar in the 1300s; Cleveland holds it as 1962.154. The record does not give the potters' names."
        sources: [F1.13-C02]
        claim: f13-e-jar
      duration: held
      reduced: still
    - n: 5
      surface: timeline
      camera: { move: cut }
      clock: { mode: span, readout: "1426–35", claim: f13-e-xuande }
      actors: [ { tick: f13-e-xuande, lane: the-objects, kind: bar } ]
      labels: { primary: jingdezhen, others: [] }
      dim: [lanes]
      caption:
        text: "Jiang and colleagues tested imperial wares of the Xuande reign, 1426 to 1435: early blue-and-white relied heavily on imported cobalt from the West."
        sources: [F1.13-C03]
        claim: f13-e-xuande
      duration: held
      reduced: cut
    - n: 6
      surface: stage
      camera: { move: cut }
      clock: { mode: span, readout: "1300s", claim: f13-e-jar }
      actors: [ { object: cma-1962-154, frame: placeholder } ]
      labels: { primary: cleveland-museum-of-art, others: [] }
      dim: []
      caption:
        text: "The jar, painted in blue under its glaze: the potters and the clay were at Jingdezhen; the blue came from Iran."
        sources: [F1.13-C02, F1.13-C03]
        claim: f13-e-jar
      duration: held
      reduced: cut

- id: f13-galleons
  kind: journey
  title: The galleons
  span: [1565, 1815]
  claims: [f13-e-urdaneta, f13-e-galleon-end, f13-e-basin, F1.13-C15, F1.13-C16, F1.13-C17]
  surfaces: [globe-world, timeline, stage]
  understand: Silver went west and porcelain east on the same ships for 250 years, and so did people, on terms the goods never had.
  content_note: "Content note: this scene names people enslaved and carried across the Pacific. You can skip to the next scene; the summary keeps the dates."   # protocol level 2, once, before shot 1
  honesty: >-
    The Acapulco → Puebla leg is undated and drawn dashed. Potosí stands for "New Spain and Peru" silver, as the gazetteer says.
    The Potosí → Manila leg (172°) and the Manila → Acapulco leg (129°) exceed the 70° follow window, so the globe turns first
    and keeps turning with the glyph; the leading stop stays in the central 60 % of the view. "As much as a third" is one
    estimate and is written probable. The enslaved people carried on the same ships are a card beside the leg, never a mark
    on it; no count is recorded. The basin's image is the holder's photograph, placed at build.
  guess: none          # station 6's predict ("How much of the silver mined in New Spain and Peru went to Asia?") has no id in f1-13.json
  ends_on:
    object: met-12-3-1
    frame: placeholder
    text: "the holder's photograph, placed at build"
    holder: The Metropolitan Museum of Art
    accession: "12.3.1"
    date: ca. 1650
    licence: Public domain
  shots:
    - n: 1
      surface: globe-world
      before: true
      camera: { move: settle, keep: [manila, acapulco] }       # Pacific-centred: the view centre on the leg's midpoint, 38.9° N 170.3° W
      clock: { mode: span, readout: "1565–1815", claim: [f13-e-urdaneta, f13-e-galleon-end] }
      actors: []                                              # the content note holds; the full route at a quarter, nothing moves
      labels: { primary: manila, others: [acapulco] }
      dim: [routes, marks]
      caption:
        text: "Silver went west and porcelain east on the same ships, 1565 to 1815, and so did people, on terms the goods never had."
        sources: [F1.13-C15, F1.13-C17, NET036]
        claim: [f13-e-urdaneta, f13-e-galleon-end]
      duration: held
      reduced: still
    - n: 2
      surface: globe-world
      camera: { move: settle, keep: [potosi, acapulco] }
      clock: { mode: point, readout: "1565", claim: f13-e-urdaneta }
      actors: [ { glyph: coin, at: potosi } ]                 # "the silver mined in New Spain and Peru"; the number rides the caption
      labels: { primary: potosi, others: [acapulco] }
      dim: [routes, marks]
      caption:
        text: "Potosí's silver: as much as one-third of the silver mined in New Spain and Peru went to Asia, by one estimate; we call that probable."
        sources: [F1.13-C15]
        claim: F1.13-C15
      duration: held
      reduced: cut
    - n: 3
      surface: globe-world
      camera: { move: follow, legs: [[potosi, manila]], per_leg: 1.2 }
      clock: { mode: span, readout: "1565–1815", claim: [f13-e-urdaneta, f13-e-galleon-end] }
      actors: [ { glyph: coin, follow: legs, dated: true } ]
      labels: { primary: manila, others: [potosi], ink_as_drawn: true }
      dim: [routes, marks]
      caption:
        text: "From 1565, Urdaneta's return route opens the galleon trade; silver from Potosí crosses to Manila."
        sources: [OCC067, F1.13-C15]
        claim: f13-e-urdaneta
      duration: held
      reduced: fade
    - n: 4
      surface: globe-world
      camera: { move: follow, legs: [[manila, acapulco]], per_leg: 1.2 }
      clock: { mode: span, readout: "1565–1815", claim: [f13-e-urdaneta, f13-e-galleon-end] }
      actors: [ { glyph: ship, follow: legs, dated: true } ]
      labels: { primary: acapulco, others: [manila], ink_as_drawn: true }
      dim: [routes, marks]
      caption:
        text: "Galleons carried porcelain, silk, ivory and spices to Acapulco, from 1565 to the last Manila galleon of 1815."
        sources: [F1.13-C15, NET036]
        claim: [f13-e-urdaneta, f13-e-galleon-end]
      duration: held
      reduced: fade
    - n: 5
      surface: globe-world
      camera: { move: hold }
      clock: { mode: span, readout: "1565–1815", claim: [f13-e-urdaneta, f13-e-galleon-end] }
      actors: [ { card: people, at: acapulco, beside_leg: [manila, acapulco], claim: F1.13-C17 } ]   # a card beside the leg; no glyph, no chip (no name recorded), no count
      labels: { primary: acapulco, others: [manila] }
      dim: [routes, marks]
      caption:
        text: "On the same ships, people: enslaved people from the Indian subcontinent and Southeast Asia, grouped by Spanish records as chinos; from 1672 counted as Indians."
        sources: [F1.13-C17]
        claim: F1.13-C17
      duration: held
      reduced: still
    - n: 6
