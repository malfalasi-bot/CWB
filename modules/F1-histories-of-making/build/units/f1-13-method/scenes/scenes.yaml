      camera: { move: follow, legs: [[acapulco, puebla]], per_leg: 1.2, inset: true }
      clock: { mode: span, readout: "1565–1815", claim: [f13-e-urdaneta, f13-e-galleon-end] }
      actors: [ { line: journey, follow: legs, dated: false } ]      # dashed; no glyph, no content line names the carrier
      labels: { primary: puebla, others: [acapulco], ink_as_drawn: true }
      dim: [routes, marks]
      caption:
        text: "Mexican ceramics display the impact of the galleon trade most vividly, Hecht writes; the leg from Acapulco to Puebla is undated."
