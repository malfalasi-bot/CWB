        claim: F1.13-C15
      duration: held
      reduced: fade
    - n: 7
      surface: stage
      camera: { move: cut }
      clock: { mode: point, readout: "c. 1650", claim: f13-e-basin }
      actors: [ { object: met-12-3-1, frame: placeholder } ]
      labels: { primary: the-metropolitan-museum-of-art, others: [] }
      dim: []
      caption:
        text: "A basin from Puebla, tin-glazed earthenware, about 1650; the Met credits it to \"Master Potter A\", a scholars' name for an unnamed hand."
        sources: [F1.13-C16]
        claim: f13-e-basin
      duration: held
      reduced: cut

- id: f13-omar
  kind: incident                 # a person's journey: no follow shot, because no leg is drawn (research.md, the human-flow rule)
  title: Omar ibn Said
  span: [1501, 1866]
  claims: [f13-e-tast-span, f13-e-omar-captured, f13-e-omar-writes, F1.13-C22]
  surfaces: [globe-world, timeline, stage]
  understand: One man the record names, Omar ibn Said, wrote his own life in Arabic in 1831 while enslaved; the count of the trade is given in words, and no line is drawn for people.
  content_note: "Content note: this scene is about the Atlantic slave trade. Traders forced about 12.5 million African people onto ships, 1501 to 1866, and many died at sea. We show no images of bodies or ships. You can skip this scene; the summary keeps the count."   # protocol level 2 (AR-081), once, before shot 1
  protocol: "level 2: content note (AR-081); his name and his Arabic text lead; the English title page is not shown; a Qur'anic leaf is shown whole"
  rule: "human-flow: a person, the chip; content note AR-081; his name and his Arabic text lead; no glyph; no goods grammar"   # inventory.json j-omar
  honesty: >-
    No line is drawn between Futa Toro, South Carolina and North Carolina: the lecture's own line is "dots with his name, and no arrow",
    so the one dated leg (1807) is shown as a tick and a pulse at the place reached, not as a route. Futa Toro is placed by region
    (anchored at Podor) and is a soft blot. South Carolina and North Carolina are closer than 18 px at world scale and are labelled
    in sequence, then share one leader. The count of the trade is a card in words, never a bubble or a crawl. His death, 1863 or 1864,
    is contested and never a tick or a clock. The Arabic spelling of his name is not in the unit's files and is left for the record
    to supply at build. The manuscript's image is the holder's photograph, placed at build.
  guess: none
  ends_on:
    object: loc-2018371864
    frame: placeholder
    text: "the holder's photograph, placed at build"
    holder: Library of Congress
    accession: "2018371864"
    date: 1831
    licence: Public domain
  shots:
    - n: 1
      surface: globe-world
      before: true
      camera: { move: settle, keep: [futa_toro, charleston] }     # the Atlantic; the lecture's focus 42° W 24° N
      clock: { mode: span, readout: "1501–1866", claim: f13-e-tast-span }
      actors: [ { card: count, claim: f13-e-tast-span, text: "about 12.5 million people departed Africa, 1501–1866; about 10.7 million disembarked" } ]   # a card on the caption; no line, no bubble, no crawl
      labels: { primary: none, others: [] }
      dim: [routes, marks, washes]
      caption:
        text: "SlaveVoyages estimates that 12,520,000 people departed Africa, 1501 to 1866, and that about 10.7 million disembarked, mainly in the Americas."
        sources: [F1.13-C20]
        claim: f13-e-tast-span
      duration: held
      reduced: still
    - n: 2
      surface: globe-world
      camera: { move: hold }
      clock: { mode: held, readout: "clock held", claim: none }     # the birth rests on F1.13-C22, which also holds the contested death (1863 or 1864): no record of his may drive the clock below documented, so the clock is held; the caption carries "about 1770"
      actors: [ { chip: omar-ibn-said, at: futa_toro, approx: true } ]    # the person is the chip; Futa Toro a soft blot
      labels: { primary: futa_toro, others: [] }
      dim: [routes, marks]
      caption:
        text: "Omar ibn Said was born in Futa Toro, about 1770."
        sources: [F1.13-C22]
        claim: F1.13-C22
      duration: held
      reduced: still
    - n: 3
      surface: globe-world
      camera: { move: hold }
      clock: { mode: point, readout: "1807", claim: f13-e-omar-captured }
      actors:
        - { pulse: incident, at: charleston, once: true }                 # seal red, one 600 ms pulse: the capture is the incident
        - { chip: omar-ibn-said, at: charleston }
      labels: { primary: charleston, others: [futa_toro] }
      dim: [routes, marks]
      caption:
        text: "Omar ibn Said was captured in 1807 and brought to South Carolina."
        sources: [F1.13-C22]
        claim: f13-e-omar-captured
      duration: held
      reduced: still
    - n: 4
      surface: globe-world
      camera: { move: hold }
      clock: { mode: point, readout: "1831", claim: f13-e-omar-writes }
      actors: [ { chip: omar-ibn-said, at: fayetteville } ]
      labels: { primary: fayetteville, others: [charleston, futa_toro], shared_leader: [charleston, fayetteville] }
      dim: [routes, marks]
      caption:
        text: "In 1831, while enslaved in North Carolina, Omar ibn Said wrote his life in Arabic."
        sources: [F1.13-C22]
        claim: f13-e-omar-writes
      duration: held
      reduced: still
    - n: 5
      surface: globe-world
      camera: { move: hold }
      clock: { mode: point, readout: "1831", claim: f13-e-omar-writes }
      actors: [ { card: quotation, claim: F1.13-C22 } ]
      labels: { primary: fayetteville, others: [charleston] }
      dim: [routes, marks]
      caption:
        text: "\"I continued seeking knowledge for 25 years,\" Omar ibn Said wrote. James Owen of Bladen County was his enslaver."
        sources: [F1.13-C22]
        claim: F1.13-C22
      duration: held
      reduced: still
    - n: 6
      surface: timeline
      camera: { move: cut }
      clock: { mode: point, readout: "1831", claim: f13-e-omar-writes }   # the clock rests on the documented record; the contested death never drives it
      actors: [ { card: note, claim: F1.13-C22, alternates: [1863, 1864], mark: dotted-bar } ]
      labels: { primary: none, others: [] }
      dim: [lanes]
      caption:
        text: "Omar ibn Said died, still enslaved, in 1863 or 1864; the sources differ (contested), and we give both years."
        sources: [F1.13-C22]
        claim: F1.13-C22
      duration: held
      reduced: still
    - n: 7
      surface: stage
      camera: { move: cut }
      clock: { mode: point, readout: "1831", claim: f13-e-omar-writes }
      actors: [ { object: loc-2018371864, frame: placeholder, leaf: "a Qur'anic leaf, whole, never cropped", not_shown: "the English title page" } ]
      labels: { primary: library-of-congress, others: [] }
      dim: []
      caption:
        text: "Omar ibn Said's life, written in Arabic, 1831: the Library of Congress holds it as 2018371864; a Qur'anic leaf is shown whole."
        sources: [F1.13-C22]
        claim: f13-e-omar-writes
      duration: held
      reduced: cut

- id: f13-blue-north
  kind: run
  title: The blue goes north
  span: [1592, 1659]
  claims: [f13-e-imjin, f13-e-carracks, f13-e-kraak, f13-e-arita, f13-e-sakoku, f13-e-voc-order, F1.13-C18, F1.13-C19]
  surfaces: [timeline, globe-world, stage]
  understand: The blue leaves China as export ware, and a skill reaches Arita with the people who were taken.
  content_note: "Content note: this scene names potters taken by force. You can skip to the next scene; the summary keeps the dates."   # protocol level 2, once, before shot 1
  group: g-porcelain-north           # inventory.json; five ticks and one contested card
  ticks: [f13-e-imjin, f13-e-carracks, f13-e-kraak, f13-e-sakoku, f13-e-voc-order]   # e-arita is contested: a card, never a tick
  honesty: >-
    The Arita find (early 1600s) is contested and is a card over a dotted bar across its alternates, never a tick or a clock.
    The dish's route to Amsterdam is not recorded and is drawn dashed. Joseon and China are placed by region (anchored at Busan
    and Jingdezhen) and are soft blots. The potters taken to Japan are chips at both ends, with no line between them.
    The carracks (1602–04) and the sakoku edicts (1633–39) are canon rows the lecture does not narrate (OCC072, OCC077);
    their captions carry only what the rows say. "Earliest known large order" renders the row's "first". The dish's image
    is the holder's photograph, placed at build.
  guess: none          # station 7's predict ("When was it made?") has no id in f1-13.json
  ends_on:
    object: rijks-ak-rbk-16385
    frame: placeholder
    text: "the holder's photograph, placed at build"
    holder: Rijksmuseum
    accession: AK-RBK-16385
    date: c. 1600–1625
    licence: CC0 1.0
  shots:
