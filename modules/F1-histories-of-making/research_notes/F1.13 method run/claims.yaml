# F1.13 Networks: objects, materials, skills and people — the claims register
# Schema: skills/histories-of-making-design/references/claims.md §1.
# One record per dated or numbered claim, keyed by the claim, not the year.
# Ids: f13-<inventory event id> for every event in inventory.json;
#      f13-<register or canon id, lowercased>[-aspect] for dated or numbered claims
#      with no inventory event. Stable once frozen (tag claims-v1).
# Extra fields beyond the schema: `protocol` (level 1–6 and the reason, as plan.md
# assigns), `rule` (the human-flow display rule), `as_of` (the year a count was
# taken), and `lecture` inside where_used (station ids in f1-13.json).
# Sources: register ids (F1.13-Cnn), canon ids (OCCnnn, NETnnn, DIAnnn, COMnnn,
# CIVnnn, PRAnnn), or a research-note citation. Nothing here is from memory.
# Written by Claude Fable 5.1, 20 October 2026, from research.md, benchmark.md,
# inventory.json, plan.md, claims_specs_v1.csv (F1.13-C01–C25), f1-13.json and
# grouping-pages/indian_ocean.md. Unfrozen until the editor signs it.

