# Ballet core register, Creative World F1 (Histories of making)
# Built 2026-10-21. See CENSUS.md for method, thread definitions and card design.
#
# FIELD KEY
#   id            slug: short-title-year (year of the premiere of THIS version)
#   title         {orig: original-language title, en: English title}
#   premiere      {date: ISO where known, else year; place: city, theatre; company}
#   choreographer, composer, scenario (librettist / scenario author), designer: lists
#   based_on      literary or other source ("none" for plotless; "remake of <id>" for re-readings)
#   premise       one line, our wording
#   period        court | enlightenment | romantic | imperial | modernist | postwar | late20 | c21
#   region        country or culture of making
#   w_file        where it is taken apart in depth (works/W1..W3 section) or null
#   tier          A = full card exists in W1-W3; B = needs a full card; C = short card
#   threads       cross-work concept codes (defined in CENSUS.md section 4)
#   confidence    documented = seen at source this pass or in a W file with its citation;
#                 probable = working knowledge, not re-checked this pass;
#                 contested = sources disagree (see note)
#   sources       where each fact was seen. "W1 §5" = works/W1_court_to_imperial.md section 5.
#                 URLs appear only where they were returned by a search or fetch in this pass.
#                 No Wikidata QIDs: the endpoint was blocked in this session (CENSUS.md §0).
#   note          open questions for the human check
#
# Names: Japanese names family name first. "Earliest known", never "first".

works:

